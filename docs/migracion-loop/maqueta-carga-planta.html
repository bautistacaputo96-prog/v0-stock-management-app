<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Despacho y carga</title>
<style>
/* Estilo de la pantalla nueva de despacho (fase 3, ajuste del 21/10): 13 px de base, 11–12 px lo secundario,
   bordes finos, color solo en la franja izquierda y en etiquetas suaves, botones de tamaño mouse. */
:root{
  --bg:#ffffff; --card:#ffffff; --fg:#0a0a0a; --mu:#737373; --bd:#e5e5e5; --soft:#f5f5f5; --ring:#3b82f6;
  --blue:#2563eb; --blue-50:#eff6ff; --blue-8:#1e40af;
  --em:#10b981; --em-50:#ecfdf5; --em-8:#065f46;
  --am:#f59e0b; --am-50:#fffbeb; --am-8:#92400e;
  --red:#dc2626; --red-50:#fef2f2; --red-7:#b91c1c;
  --cy-50:#ecfeff; --cy-8:#155e75; --vi:#a78bfa; --vi-50:#f5f3ff; --vi-8:#5b21b6;
  --sl-2:#e2e8f0; --sl-6:#475569;
}
.hc{ --bd:#999999; --mu:#1a1a1a; --soft:#e8e8e8; }
.hc .card,.hc .col,.hc .vr,.hc .cr,.hc .pr{ border-color:#555 !important }
.hc .tag,.hc .st{ border:1px solid #333 }
.hc *{ font-weight:500 }
.hc b,.hc .sb,.hc h1,.hc h2,.hc h3{ font-weight:700 }
.hc .bgred{ background:#ffd6d6 !important }
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.3 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;cursor:pointer;color:inherit}
button:disabled{cursor:not-allowed}
input,select,textarea{font:inherit;color:inherit}
.mu{color:var(--mu)}
.sb{font-weight:600}
.num{font-variant-numeric:tabular-nums}
.sp{flex:1}
.tr{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.x11{font-size:11px}.x12{font-size:12px}

/* Botones */
.btn{height:30px;padding:0 10px;border:1px solid var(--bd);background:var(--card);border-radius:6px;font-size:12.5px;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--soft)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.pri:hover:not(:disabled){background:#1d4ed8}
.btn.ok{background:#16a34a;border-color:#16a34a;color:#fff}
.btn.ok:hover:not(:disabled){background:#15803d}
.btn.amb{border-color:#fbbf24;background:var(--am-50);color:var(--am-8)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--mu)}
.btn.sm{height:26px;padding:0 8px;font-size:12px}
.btn:disabled{opacity:.45}
.lnk{border:0;background:none;padding:0;text-decoration:underline;color:var(--blue-8);font-size:12px}

/* Franja de la maqueta */
.demo{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;padding:4px 12px;background:#1e293b;color:#e2e8f0;font-size:12px}
.demo b{color:#fff}
.demo select{background:#334155;color:#fff;border:1px solid #475569;border-radius:5px;padding:2px 5px;font-size:12px;max-width:100%}
.demo a{color:#93c5fd;cursor:pointer;text-decoration:underline}

.equipos{display:flex;gap:6px;align-items:stretch;padding:6px 12px 0;flex-wrap:wrap}
.equipos button{border:1px solid var(--bd);border-bottom:2px solid transparent;background:var(--soft);border-radius:7px 7px 0 0;padding:4px 12px;text-align:left;font-size:13px;color:var(--mu)}
.equipos button.on{background:var(--card);color:var(--fg);border-bottom-color:var(--blue);box-shadow:0 -1px 0 var(--bd) inset}
.equipos button .d{display:block;font-size:11px;color:var(--mu);font-weight:400}
.equipos .flow{align-self:center;font-size:11.5px;color:var(--mu);margin-left:6px}
/* Barra de arriba */
.top{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;padding:5px 12px;border-bottom:1px solid var(--bd);background:var(--bg)}
.top h1{font-size:16px;font-weight:600;margin:0}
.badge{font-size:10.5px;font-weight:600;color:var(--vi-8);background:var(--vi-50);border-radius:999px;padding:1px 7px}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:6px;padding:2px}
.seg button{height:26px;border:0;background:transparent;border-radius:4px;padding:0 9px;font-size:12.5px;color:var(--mu)}
.seg button.on{background:var(--soft);color:var(--fg);font-weight:600}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--mu);white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--em);display:inline-block}
.chip.off i{background:var(--red)}
.chip.off{color:var(--red-7);font-weight:600}
.hcbtn{height:28px;width:30px;border:1px solid var(--bd);border-radius:6px;background:var(--card);font-size:14px}

.wrap{padding:6px 12px 0}
.cont{display:flex;flex-wrap:wrap;gap:2px 16px;align-items:center;border:1px solid var(--bd);border-radius:6px;padding:3px 10px;font-size:12px}
.cont .l{color:var(--mu)}
.bans{display:flex;flex-direction:column;gap:4px;margin-top:5px}
.ban{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border:1px solid var(--bd);border-left:3px solid var(--am);border-radius:6px;padding:3px 10px;font-size:12px;background:var(--card)}
.ban.red{border-left-color:var(--red);background:var(--red-50);color:var(--red-7);font-weight:600}
.ban.dark{border-left-color:#0f172a;background:#f1f5f9;color:#0f172a;font-weight:600}

/* Columnas */
.grid{display:grid;gap:8px;padding:6px 12px 8px}
.col{border:1px solid var(--bd);border-radius:6px;display:flex;flex-direction:column;overflow:hidden;background:var(--card);min-height:0}
.ch{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--bd);padding:4px 10px;min-height:31px;flex-wrap:wrap}
.ch h2{font-size:14px;font-weight:600;margin:0}
.cb{flex:1;overflow:auto;padding:5px;display:flex;flex-direction:column;gap:3px;min-height:0}
.hint{background:var(--blue-50);color:var(--blue-8);border-radius:5px;padding:3px 8px;font-size:12px;display:flex;gap:6px;align-items:center}
.empty{color:var(--mu);text-align:center;padding:20px 6px;font-size:12px}
.tabs3{display:flex;gap:2px}
.tabs3 button{height:26px;border:0;background:transparent;border-radius:4px;padding:0 8px;font-size:13px;color:var(--mu)}
.tabs3 button.on{font-weight:600;color:var(--fg);text-decoration:underline;text-underline-offset:4px}
.tabs3 .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--blue);margin-left:4px;vertical-align:1px}

/* Filas */
.vr,.cr,.pr,.kr{border:1px solid var(--bd);border-left:3px solid var(--vi);border-radius:6px;background:var(--card);display:flex;align-items:center;gap:7px;padding:3px 4px 3px 8px;cursor:pointer;text-align:left;width:100%}
.vr.late{border-left-color:var(--red);background:#fef2f280}
.vr.now{border-left-color:var(--am)}
.vr.sel,.cr.sel,.kr.sel{box-shadow:0 0 0 2px var(--ring)}
.vr .h{width:38px;flex:none;line-height:1.15}
.vr .h b{font-size:13px;font-weight:600}
.vr .h div{font-size:10.5px;color:var(--mu)}
.ln{min-width:0;flex:1;line-height:1.25}
.l1{display:flex;align-items:center;gap:5px;font-size:13px}
.l2{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--mu)}
.tag{font-size:10.5px;font-weight:600;border-radius:4px;padding:0 4px;line-height:16px;white-space:nowrap;flex:none}
.tR{background:var(--em-50);color:var(--em-8)} .tX{background:var(--am-50);color:var(--am-8)}
.tok{background:var(--em-50);color:var(--em-8)} .tbad{background:var(--red-50);color:var(--red-7)} .twarn{background:var(--am-50);color:var(--am-8)}
.tblue{background:var(--blue-50);color:var(--blue-8)} .tcy{background:var(--cy-50);color:var(--cy-8)} .tsl{background:var(--sl-2);color:#1e293b} .tvi{background:var(--vi-50);color:var(--vi-8)}
.cr.k-planta{border-left-color:var(--em)} .cr.k-yendo{border-left-color:#3b82f6} .cr.k-obra{border-left-color:var(--am)} .cr.k-volviendo{border-left-color:#06b6d4} .cr.k-taller{border-left-color:var(--sl-6)} .cr.k-carga{border-left-color:#7c3aed}
.cr.lit{box-shadow:0 0 0 2px var(--em)}
.cr.dim{opacity:.5}
.pr{border-left-color:var(--bd);cursor:default}
.pr .bar{height:3px;background:var(--sl-2);border-radius:9px;overflow:hidden;margin-top:2px}
.pr .bar i{display:block;height:100%;background:var(--em)}
.kr{border-left-color:#7c3aed}
.kr.blk{border-left-color:var(--red)} .kr.run{border-left-color:var(--blue)}

/* Panel de carga */
.kp{display:flex;flex-direction:column;gap:5px;padding:6px 8px;overflow:auto;flex:1;min-height:0}
.kh{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.kh .pat{font-size:15px;font-weight:700;letter-spacing:.04em}
.st{font-size:11px;font-weight:600;border-radius:4px;padding:1px 6px;white-space:nowrap}
.st.idle{background:var(--soft);color:var(--mu)} .st.lista{background:var(--em-50);color:var(--em-8)} .st.blk{background:var(--red-50);color:var(--red-7)}
.st.ciclo{background:#16a34a;color:#fff} .st.susp{background:var(--am-50);color:var(--am-8)} .st.par{background:#0f172a;color:#fff} .st.prep{background:var(--blue-50);color:var(--blue-8)}
.chks{display:flex;flex-wrap:wrap;gap:3px}
.ck{font-size:11.5px;border:1px solid var(--bd);border-radius:5px;padding:1px 6px;display:inline-flex;gap:4px;align-items:center;white-space:nowrap}
.ck b{font-weight:700}
.ck.ok b{color:#16a34a} .ck.no{border-color:#fca5a5;background:var(--red-50);color:var(--red-7)} .ck.wa{border-color:#fcd34d;background:var(--am-50);color:var(--am-8)}
.box{border:1px solid var(--bd);border-left:3px solid var(--red);border-radius:6px;padding:5px 8px;font-size:12px}
.box.am{border-left-color:var(--am)} .box.bl{border-left-color:var(--blue)} .box.dk{border-left-color:#0f172a}
.box h3{font-size:12.5px;font-weight:600;margin:0 0 3px}

/* Planta */
.plant{position:relative;border:1px solid var(--bd);border-radius:6px;padding:5px}
.groups{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-end}
.grp{border:1px dashed var(--bd);border-radius:6px;padding:3px 4px}
.grp>.gt{font-size:10px;font-weight:600;color:var(--mu);text-transform:uppercase;letter-spacing:.05em;margin:0 1px 2px}
.grp .row{display:flex;gap:4px;align-items:flex-end}
.vsl{width:var(--vw,56px);border-radius:5px;padding:2px;border:1px solid transparent}
.vsl.act{border-color:var(--ring);background:var(--blue-50)}
.vsl.off{opacity:.4}
.vsl .vt{font-size:10.5px;font-weight:600;display:flex;justify-content:space-between;gap:2px}
.vsl .vm{font-size:10.5px;line-height:1.1;min-height:23px}
.tank{position:relative;height:var(--th,38px);border:1.5px solid #94a3b8;border-bottom:0;border-radius:4px 4px 0 0;background:#fff;overflow:hidden;margin-top:2px}
.tank.silo{height:calc(var(--th,38px) + 12px);border-radius:16px 16px 0 0}
.tank.round{border-radius:9px;border-bottom:1.5px solid #94a3b8}
.tank .fill{position:absolute;left:0;right:0;bottom:0}
.tank .lv{position:absolute;right:2px;top:1px;font-size:9px;color:#334155}
.hop{height:9px;background:#cbd5e1;clip-path:polygon(0 0,100% 0,64% 100%,36% 100%)}
.hop.act{background:var(--ring)}
.nums{display:flex;justify-content:space-between;font-size:10px;color:var(--mu);margin-top:1px;line-height:1.15}
.nums b{font-size:12px;color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}
.hum{font-size:9.5px;color:var(--cy-8)} .hum.w{color:var(--am-8);font-weight:700}
.chg{border:1px solid var(--bd);background:var(--card);border-radius:4px;font-size:10px;padding:0 4px;height:17px;margin-top:1px}
.bals{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.bal{flex:1;min-width:92px;border:1px solid var(--bd);border-radius:5px;padding:2px 6px;font-size:10.5px}
.bal.pes{border-color:var(--ring)} .bal.des{border-color:#16a34a}
.bal .bt{display:flex;justify-content:space-between;gap:3px;color:var(--mu)}
.bal .bv{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.bal .bb{height:3px;background:var(--sl-2);border-radius:9px;overflow:hidden}
.bal .bb i{display:block;height:100%;background:var(--ring)} .bal.des .bb i{background:#16a34a}
.be{font-size:9.5px;font-weight:700;border-radius:3px;padding:0 4px;letter-spacing:.03em}
.be.vacia{background:var(--em-50);color:var(--em-8)} .be.pesando{background:var(--ring);color:#fff} .be.llena{background:var(--am-50);color:var(--am-8)} .be.descargando{background:#16a34a;color:#fff}
.bottom{display:flex;gap:6px;align-items:flex-end;margin-top:4px}
.cinta-w{flex:1;min-width:60px;font-size:10.5px;color:var(--mu)}
.cinta{height:10px;border-radius:5px;border:1.5px solid #94a3b8;background:repeating-linear-gradient(90deg,#e5e7eb 0 10px,#f3f4f6 10px 20px);margin-top:2px}
.cinta.run{animation:belt .5s linear infinite;background:repeating-linear-gradient(90deg,#d6a77a 0 10px,#a3a9b3 10px 20px)}
@keyframes belt{to{background-position:20px 0}}
.truck{width:var(--tw,120px);flex:none;position:relative;text-align:center}
.truck svg{width:100%;height:auto;display:block}
.truck .tp{font-weight:700;font-size:12px;letter-spacing:.05em}
.truck .tm{font-size:10.5px;color:var(--mu)}
.truck.horn::after{content:"BOCINA";position:absolute;left:0;top:0;background:var(--am);color:#fff;font-weight:700;font-size:10px;border-radius:4px;padding:0 4px;animation:pulse .4s infinite}
@keyframes pulse{50%{opacity:.6}}
.drum-st{animation:drum 1s linear infinite}
@keyframes drum{to{transform:translateX(-24px)}}
.prog{display:flex;gap:3px}
.prog div{flex:1;height:5px;background:var(--sl-2);border-radius:9px;overflow:hidden}
.prog div i{display:block;height:100%;background:#16a34a}
.overlay{position:absolute;inset:0;background:rgba(15,23,42,.85);color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;border-radius:6px;font-weight:600;font-size:13px;z-index:5}
.overlay small{display:block;font-weight:400;font-size:12px;color:#cbd5e1;margin-top:3px}
.ctr{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.cargar{height:34px;padding:0 18px;border:0;border-radius:6px;background:#16a34a;color:#fff;font-weight:700;font-size:13.5px;letter-spacing:.03em}
.cargar:disabled{background:#cbd5e1;color:#475569}
.why{font-size:11.5px;color:var(--red-7)}
.nodisp{border:1px dashed #94a3b8;border-radius:6px;padding:5px 8px;font-size:12px;color:var(--sl-6)}

/* PARAR fijo (grande y siempre) */
.parar{position:fixed;right:14px;bottom:12px;z-index:40;width:132px;height:60px;border-radius:10px;border:3px solid #fff;background:var(--red);color:#fff;font-size:22px;font-weight:800;letter-spacing:.06em;box-shadow:0 6px 18px rgba(220,38,38,.4),0 0 0 1.5px var(--red);line-height:1}
.parar small{display:block;font-size:10px;font-weight:600;letter-spacing:0;opacity:.95;margin-top:2px}
.hc .parar{border-color:#000;box-shadow:0 0 0 3px #000}

/* Tablas */
table.t{border-collapse:collapse;width:100%;font-size:12px}
table.t th{text-align:left;font-size:11px;color:var(--mu);font-weight:600;padding:3px 6px;border-bottom:1px solid var(--bd);white-space:nowrap;background:var(--soft)}
table.t td{padding:3px 6px;border-bottom:1px solid var(--bd);white-space:nowrap}
table.t td.r,table.t th.r{text-align:right}
table.t tr.bad td{background:var(--red-50)}
table.t tr.wbad td{background:var(--am-50)}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:var(--soft)}
.tw{overflow-x:auto}
.okc{color:#15803d;font-weight:600}.badc{color:var(--red-7);font-weight:600}.wrnc{color:var(--am-8);font-weight:600}

/* Vista solo carga */
.solo{display:grid;grid-template-columns:230px minmax(0,1fr) 300px;gap:8px;padding:6px 12px 8px}
.pane{padding:6px 12px 80px;display:flex;flex-direction:column;gap:8px;overflow:auto}
.card{border:1px solid var(--bd);border-radius:6px;background:var(--card)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sum{display:flex;flex-wrap:wrap;gap:2px 16px;border:1px solid var(--bd);border-radius:6px;padding:4px 10px;font-size:12px}
.cats{display:flex;gap:4px;flex-wrap:wrap}
.cat{height:28px;border:1px solid var(--bd);border-radius:6px;background:var(--card);padding:0 8px;font-size:12px}
.cat b{font-variant-numeric:tabular-nums}
.cat.on{background:#0f172a;border-color:#0f172a;color:#fff}
.cat.hot b{color:var(--red-7)} .cat.on.hot b{color:#fca5a5}
.flag{font-size:10.5px;font-weight:600;border-radius:4px;padding:0 4px;margin-right:2px;white-space:nowrap;display:inline-block}
.f-sinRemito{background:var(--red-50);color:var(--red-7)} .f-sinCarga{background:#fff7ed;color:#9a3412} .f-difVol{background:var(--vi-50);color:var(--vi-8)}
.f-desv{background:#fdf2f8;color:#9d174d} .f-receta{background:var(--am-50);color:var(--am-8)} .f-indumix{background:#f0f9ff;color:#075985} .f-parada{background:#1e293b;color:#fff} .f-ok{background:var(--em-50);color:var(--em-8)} .f-sinNP{background:var(--red-50);color:var(--red-7)}
.insight{border:1px solid #fed7aa;border-left:3px solid #f97316;border-radius:6px;padding:5px 10px;font-size:12px;color:#7c2d12}
.al{border:1px solid var(--bd);border-left:3px solid var(--red);border-radius:6px;padding:5px 8px;display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;font-size:12.5px}
.al.amber{border-left-color:var(--am)} .al.info{border-left-color:var(--sl-6)} .al.done{border-left-color:var(--em);opacity:.8}
.al .at{flex:1;min-width:220px} .al .dd{font-size:11.5px;color:var(--mu);margin-top:1px}

/* Modales */
.mbg{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:flex-start;justify-content:center;z-index:60;padding:28px 12px;overflow:auto}
.modal{background:var(--card);border-radius:10px;width:100%;max-width:560px;box-shadow:0 18px 40px rgba(0,0,0,.25);font-size:13px}
.modal.lg{max-width:860px} .modal.sm{max-width:420px}
.mh{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--bd)}
.mh h3{margin:0;font-size:15px;font-weight:600;flex:1}
.mb{padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.mf{display:flex;gap:6px;justify-content:flex-end;padding:8px 12px;border-top:1px solid var(--bd);flex-wrap:wrap}
.xbtn{border:0;background:transparent;width:28px;height:28px;border-radius:5px;font-size:18px;color:var(--mu)}
.head{background:var(--soft);border-radius:6px;padding:6px 9px;font-size:12.5px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fld label{display:block;font-size:11.5px;font-weight:600;margin-bottom:2px}
.fld input,.fld select,.fld textarea{width:100%;height:30px;border:1px solid #d4d4d4;border-radius:6px;padding:0 8px;background:var(--card);font-size:13px}
.fld textarea{height:auto;padding:5px 8px}
.fld .help{font-size:11px;color:var(--mu);margin-top:2px}
.npl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;border:1px solid var(--bd);border-left:3px solid var(--em);border-radius:6px;padding:4px 8px;font-size:12.5px}
.npl.no{border-left-color:var(--red);background:var(--red-50)}
.npl.gen{border-left-color:var(--blue)}
.opt{border:1px solid var(--bd);border-radius:6px;padding:6px 9px;background:var(--card);text-align:left;width:100%}
.opt.on{border-color:var(--ring);box-shadow:0 0 0 2px var(--blue-50)}
.opt .ot{font-weight:600} .opt .od{font-size:11.5px;color:var(--mu);margin-top:1px}
.cbx{display:flex;gap:7px;align-items:flex-start;font-size:12.5px;border:1px solid var(--bd);border-radius:6px;padding:5px 8px}
.cbx input{width:16px;height:16px;margin:1px 0 0;flex:none}

.err{background:var(--red-50);color:var(--red-7);border-radius:6px;padding:5px 9px;font-size:12.5px}
.okbox{background:var(--em-50);color:var(--em-8);border-radius:6px;padding:5px 9px;font-size:12.5px}
.ac{background:var(--am-50);color:#78350f;border-radius:6px;padding:5px 9px;font-size:12px}

.hold i{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.3);width:0}
.hold span{position:relative}
.bigpat{font-size:30px;font-weight:800;letter-spacing:.08em;text-align:center;border:2px solid var(--fg);border-radius:8px;padding:2px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;font-size:12px}
.steps li{display:flex;gap:6px;color:var(--mu)} .steps li.done{color:var(--fg)} .steps li.now{color:var(--blue-8);font-weight:600}
.steps .ic{flex:none;width:15px;height:15px;border-radius:50%;border:1.5px solid #cbd5e1;display:inline-flex;align-items:center;justify-content:center;font-size:9px}
.steps li.done .ic{background:#16a34a;border-color:#16a34a;color:#fff}
.guia{position:fixed;left:12px;bottom:12px;z-index:45;width:380px;max-height:62vh;overflow:auto;background:#fff;border:1px solid #bfdbfe;border-left:3px solid var(--blue);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:8px 10px;font-size:12px;color:#1e3a8a}

.toast{position:fixed;left:50%;top:10px;transform:translateX(-50%);background:#0f172a;color:#fff;border-radius:8px;padding:7px 12px;font-size:12.5px;z-index:70;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:min(560px,80vw);display:none}

      <div class="x12"><b>${esc(o.cliente)}</b> · ${esc(o.obra)}<br>${esc(o.formula)} · receta ${C.slotN} · <b>${m3t(o.m3)} m³</b> en ${C.ciclos} ciclos</div>
      <div class="x12 mu">Despachado ${hhmm(o.despAt)} · <b style="color:var(--fg)">inicio de carga ${hms(C.inicio)}</b> · llevamos ${mmss(S.clock - C.inicio)}</div>
      ${C.aut ? `<div class="box am x12">Autorizada con receta distinta · ${esc(C.aut.por)}: «${esc(C.aut.motivo)}»</div>` : ""}
      ${controlReceta(o.formula, o.id).aguaDist ? `<div class="box am x12">Agua de la receta distinta de la fórmula: no frena, queda en la auditoría.</div>` : ""}${listaExtras(C.extras)}${ctr}`;
    return;
  }
  const ult = S.ultima ? `<div class="box bl"><h3>${esc(S.ultima.camion)} cargado ${hhmm(S.ultima.row.carga.fin)} · esperando que salga (GPS)</h3>${listaExtras(S.ultima.row.extras)}<div class="ctr">${enPlanta() ? btnAgua(conectado()) : ""}<button class="btn sm" onclick="abrirReporte(S.ultima.row)">Ver reporte</button></div></div>` : "";
  const k = cargaDe(S.selCarga); if (!k || !k.bajada) { el.innerHTML = ult + `<div class="empty">No hay una carga elegida.</div>`; return; }
  const ch = chequeo(k); const rc = ch.rc;
  let extra = "";
  if (rc.cmp && rc.bloqueaReceta) extra += `<div class="box"><h3>No se puede cargar: la receta ${rc.slot.n} no es igual a la fórmula</h3>${tablaCmp(rc.cmp)}${U().formulasEditar ? `<button class="btn sm pri" style="margin-top:4px" onclick="abrirResolver('${k.formula}')">Resolver</button>` : `<div class="x12" style="margin-top:3px">Lo resuelve quien tiene Fórmulas · editar: ${RESOLVEDORES} (ya les llegó el mail).</div>`}</div>`;
  else if (rc.aguaDist) extra += `<div class="box am"><h3>Agua de la receta distinta de la fórmula · no frena</h3><div class="x12">${esc(rc.items.find((x) => x.k === "agua").t)}. Antes de tocar el agua en la planta conviene que lo confirme Grow.</div></div>`;
  let ctr;
  if (!enPlanta()) ctr = `<div class="nodisp">CARGAR y PARAR se accionan solo desde la computadora de la planta.</div>`;
  else { const motivo = !ch.ok ? (ch.items.find((x) => !x.ok) || {}).t : ""; ctr = `<div class="ctr"><button class="cargar" onclick="pedirCargar()" ${ch.ok && U().cargaCargar ? "" : "disabled"}>CARGAR</button><button class="btn" onclick="bocina()">Bocina</button><button class="btn ghost" onclick="cancelarCarga('${k.id}')">Cancelar…</button></div>${motivo ? `<div class="why">${esc(motivo)}</div>` : `<div class="x11 mu">Antes de arrancar se confirma que el camión está abajo.</div>`}`; }
  el.innerHTML = ult + `<div class="kh"><span class="pat">${esc(k.camion)}</span><span class="tag t${k.tipo}">${k.tipo} ${esc(k.remito)}</span><span class="x12 tr"><b>${esc(k.cliente)}</b> · ${esc(k.obra)}</span></div>
    <div class="x12 mu">${esc(k.formula)} · <b style="color:var(--fg)">${m3t(k.m3)} m³</b> (${Math.ceil(k.m3 / M3C - 1e-9)} ciclos) · chofer ${esc(k.chofer)} · despachó ${esc(k.env)} · bajó ${hms(k.bajada)}</div>
    <div class="chks">${ch.items.map((x) => `<span class="ck ${!x.ok ? "no" : x.warn ? "wa" : "ok"}" title="${esc(x.t)}"><b>${!x.ok ? "✕" : x.warn ? "!" : "✓"}</b>${esc(x.c)}</span>`).join("")}</div>
    ${extra}${ctr}`;
}
function abrirReporte(row) {
  const c = row.carga; if (!c) return; const f = flagsDe(row);
  const filas = c.mats.map((x) => { const d = x.teoCorr ? (x.real - x.teoCorr) / x.teoCorr : 0; const bad = desvio(x); const tol = TOLR[x.g] || [0, 0]; const dist = x.m && x.k !== "c2" && Math.abs(x.formPm3 - x.recPm3) > Math.max(tol[0] * x.formPm3, tol[1] * (x.u === "g" ? 1000 : 1));
    return `<tr class="${bad ? "bad" : dist ? "wbad" : ""}"><td>${x.m ? S.MAT[x.m].c : "—"} <span class="mu">${x.lab}</span></td><td class="r num">${x.k === "c2" ? "—" : nf(x.formPm3, x.formPm3 % 1 ? 1 : 0)}</td><td class="r num">${nf(x.recPm3)}</td><td class="r num">${nf(x.teo)}</td><td class="r num">${x.h != null ? nf(x.h) + " %" : x.k === "w" ? "−" + nf(x.teo - x.teoCorr) : ""}</td><td class="r num">${nf(x.teoCorr)}</td><td class="r num sb">${nf(x.real)} ${x.u}</td><td class="r num ${bad ? "badc" : ""}">${d > 0 ? "+" : ""}${nf(d * 100, 1)} %</td></tr>`; }).join("");
  const ex = extraL(row); const aguaR = (c.mats.find((x) => x.k === "w") || {}).real || 0; const cpcR = c.mats.filter((x) => x.m === "cpc").reduce((s, x) => s + x.real, 0);
  const aj = row.ajustes ? `<div class="tw"><table class="t"><thead><tr><th>Ajuste de stock (kg; áridos en seco)</th><th class="r">Teórico del despacho</th><th class="r">Real</th><th class="r">Ajuste</th></tr></thead><tbody>${row.ajustes.map((a) => { const d = S.MAT[a.m].tipo === "aditivo" ? 2 : 0; return `<tr><td>${S.MAT[a.m].c}</td><td class="r num">${nf(a.teoDesp, d)}</td><td class="r num">${nf(a.real, d)}</td><td class="r num sb">${a.aj > 0 ? "+" : ""}${nf(a.aj, d)}</td></tr>`; }).join("")}</tbody></table></div>` : "";
  const tiempos = `<div class="sum"><span class="mu">Despachado (remito)</span><b>${row.horaDesp ? hhmm(row.horaDesp) : "—"}</b><span class="mu">Inicio de carga</span><b>${hms(c.inicio)}</b><span class="mu">Fin</span><b>${hms(c.fin)}</b><span class="mu">Tiempo de carga</span><b>${mmss(c.fin - c.inicio)}</b><span class="mu">Salió de planta (GPS)</span><b>${row.salida ? hhmm(row.salida) : "esperando GPS"}</b><span class="mu">Espera hasta salir</span><b>${row.salida ? Math.round((row.salida - c.fin) / 60) + " min" : "—"}</b></div>`;
  modal(`<div class="modal lg"><div class="mh"><h3>Reporte de carga N° ${c.n}${row.remito ? ` · Remito ${row.tipo || ""} ${esc(row.remito)}` : row.remAnulado ? ` · Remito ${row.tipo} ${esc(row.remAnulado)} ANULADO` : ""}</h3><button class="xbtn" onclick="cerrarModal()">×</button></div><div class="mb">
    <div class="head">${esc(row.cliente)} · <b>${esc(row.camion)}</b>${row.patPl ? ` (Indumix «${esc(row.patPl)}»)` : ""} · ${esc(row.formula)} · receta ${c.receta} «${esc(c.recNombre)}» · <b>${m3t(c.m3)} m³</b> en ${c.ciclos} ciclos · ${c.origen === "sistema" ? "desde el sistema" : c.origen === "indumix" ? "arrancada en Indumix" : "leída del reporte de Indumix"} · plantista ${esc(row.plantista || "—")}${row.remito ? ` · unión ${esc(row.union || "por id")}` : ""}</div>
    ${tiempos}
    <div>${f.length ? f.map((k) => `<span class="flag f-${k}">${FLAGN[k]}</span>`).join("") : '<span class="flag f-ok">Sin problemas</span>'}</div>
    ${row.nota ? `<div class="ac">${esc(row.nota)}</div>` : ""}
    <div class="tw"><table class="t"><thead><tr><th>Material</th><th class="r">Fórmula /m³</th><th class="r">Receta /m³</th><th class="r">Teórico</th><th class="r">Humedad</th><th class="r">Teórico corregido</th><th class="r">Real</th><th class="r">Real − teórico</th></tr></thead><tbody>${filas}
      <tr><td>Agua extra</td><td colspan="5" class="mu">${(row.extras || []).map((e) => `${nf(e.l)} L ${hhmm(e.at)}${e.despues ? " (después de terminar)" : ""} · ${esc(e.por)}`).join(" · ") || "no se agregó"}</td><td class="r num sb">${nf(ex)} L</td><td class="r x11 mu">agua total ${nf(aguaR + ex)} L · a/c ${cpcR ? nf((aguaR + ex) / cpcR, 2) : "—"}</td></tr></tbody></table></div>
    ${aj}
    <div class="x11 mu">Teórico corregido: árido húmedo = seco × (1 + H%) y agua descontada la de los áridos, como hace Indumix. Tolerancias de pesaje: cemento ±1 %, áridos ±2 %, agua ±3 %, aditivos ±3 %. El ajuste de stock es lo real menos lo que descontó el despacho (fórmula × m³). Las horas son las del puente.</div>
  </div><div class="mf"><button class="btn pri" onclick="cerrarModal()">Cerrar</button></div></div>`);
}
function paneAuditoria() {
  const rows = S.audit; const all = rows.map((r) => ({ r, f: flagsDe(r) })); const cnt = (k) => all.filter((x) => x.f.includes(k)).length;
  const vis = S.audFiltro ? all.filter((x) => x.f.includes(S.audFiltro)) : all;
  const top = rows.filter((r) => r.carga && r.remito && r.formula === "H30-612-15 B (CAN)" && !r.carga.recOk);
  const cpcR = top.reduce((s, r) => s + r.carga.mats.filter((x) => x.m === "cpc").reduce((a, x) => a + x.real, 0), 0), cpcF = top.reduce((s, r) => s + 330 * r.carga.m3, 0);
  const conEx = rows.filter((r) => extraL(r) > 0); const totEx = conEx.reduce((s, r) => s + extraL(r), 0); const desp = conEx.reduce((s, r) => s + r.extras.filter((e) => e.despues).reduce((a, e) => a + e.l, 0), 0);
  const agrupa = (fn) => { const m = {}; for (const r of conEx) m[fn(r)] = (m[fn(r)] || 0) + extraL(r); return Object.entries(m).sort((a, b) => b[1] - a[1]).map(([k, v]) => `${esc(k)} ${nf(v)} L`).join(" · "); };
  const conT = rows.filter((r) => r.carga && r.salida); const promC = conT.length ? conT.reduce((s, r) => s + (r.carga.fin - r.carga.inicio), 0) / conT.length : 0; const promE = conT.length ? conT.reduce((s, r) => s + (r.salida - r.carga.fin), 0) / conT.length / 60 : 0;
  return `<div class="sum"><span class="mu">Remitos</span><b>${rows.filter((r) => r.remito).length}</b><span class="mu">Cargas</span><b>${rows.filter((r) => r.carga).length}</b><span class="mu">m³ remitos</span><b>${m3t(rows.reduce((s, r) => s + (r.m3 || 0), 0))}</b><span class="mu">m³ cargas</span><b>${m3t(rows.reduce((s, r) => s + (r.carga ? r.carga.m3 : 0), 0))}</b><span class="mu">Tiempo de carga prom.</span><b>${mmss(promC)}</b><span class="mu">Espera hasta salir prom.</span><b>${nf(promE, 1)} min</b><span class="mu">Con problemas</span><b style="color:var(--red-7)">${all.filter((x) => x.f.filter((k) => k !== "aguaExtra").length).length}</b></div>
    <div class="cats"><button class="cat ${!S.audFiltro ? "on" : ""}" onclick="S.audFiltro=null;renderMain()"><b>${all.length}</b> Todas</button>${Object.keys(FLAGN).map((k) => `<button class="cat ${S.audFiltro === k ? "on" : ""} ${cnt(k) ? "hot" : ""}" onclick="S.audFiltro='${k}';renderMain()"><b>${cnt(k)}</b> ${FLAGN[k]}</button>`).join("")}</div>
    ${top.length ? `<div class="insight"><b>Hoy, ${top.length} cargas de H30-612-15 B con la receta 13</b>: <b>${nf(cpcR)} kg de CPC 40</b> contra <b>${nf(cpcF)} kg</b> de la fórmula, <b>+${nf(cpcR - cpcF)} kg</b> que el stock no descontó. Agua de la receta 58 L/m³ menos (a/c 0,31 contra 0,51), resaltada pero sin frenar.</div>` : ""}
    <div class="insight" style="border-left-color:var(--blue);border-color:#bfdbfe;color:#1e3a8a"><b>Agua extra hoy: ${nf(totEx)} L en ${conEx.length} camiones</b>${desp ? ` (${nf(desp)} L después de terminar la carga)` : ""}. Por fórmula: ${agrupa((r) => r.formula) || "—"} · por camión: ${agrupa((r) => r.camion) || "—"} · por plantista: ${agrupa((r) => r.plantista || "—") || "—"}.</div>
    <div class="card"><div class="ch"><h2>Auditoría de carga · Canning · hoy</h2><span class="sp"></span><button class="btn sm" onclick="toast('Exporta a Excel (xlsx)')">Exportar a Excel</button></div><div class="tw"><table class="t" style="min-width:1180px"><thead><tr><th>Remito</th><th>Camión</th><th>Despacho</th><th>Fórmula</th><th class="r">m³</th><th style="border-left:2px solid var(--bd)">Carga</th><th>Inicio</th><th>Fin</th><th class="r">Carga</th><th>Salió (GPS)</th><th class="r">Espera</th><th class="r">m³</th><th>Receta</th><th class="r">Agua extra</th><th>Problemas</th></tr></thead><tbody>
    ${vis.map(({ r, f }) => `<tr class="${r.carga ? "click" : ""}" ${r.carga ? `onclick="abrirReporte(S.audit[${rows.indexOf(r)}])"` : ""}><td>${r.remito ? `<span class="tag t${r.tipo}">${r.tipo}</span> ${esc(r.remito)}` : r.remAnulado ? `<s>${r.tipo} ${esc(r.remAnulado)}</s> <span class="mu">anulado</span>` : '<span class="badc">sin remito</span>'}</td><td>${esc(r.camion)}</td><td class="num">${r.horaDesp ? hhmm(r.horaDesp) : "—"}</td><td>${esc(r.formula)}</td><td class="r num">${r.m3 != null ? m3t(r.m3) : "—"}</td>
      <td style="border-left:2px solid var(--bd)">${r.carga ? "N° " + r.carga.n : '<span class="badc">sin carga</span>'}</td><td class="num">${r.carga ? hhmm(r.carga.inicio) : "—"}</td><td class="num">${r.carga ? hhmm(r.carga.fin) : "—"}</td><td class="r num">${r.carga ? mmss(r.carga.fin - r.carga.inicio) : "—"}</td><td class="num">${r.salida ? hhmm(r.salida) : r.carga ? '<span class="mu">—</span>' : ""}</td><td class="r num">${r.salida && r.carga ? Math.round((r.salida - r.carga.fin) / 60) + " min" : ""}</td><td class="r num">${r.carga ? m3t(r.carga.m3) : "—"}</td><td>${r.carga ? r.carga.receta : "—"}</td><td class="r num">${extraL(r) ? nf(extraL(r)) + " L" : ""}</td>
      <td style="white-space:normal">${f.map((k) => `<span class="flag f-${k}">${FLAGN[k]}</span>`).join("") || (r.anulado ? `<span class="mu">anulado: ${esc(r.anulado)}</span>` : '<span class="flag f-ok">OK</span>')}</td></tr>`).join("")}</tbody></table></div>
    <div class="x11 mu" style="padding:4px 8px">«Despacho» es la hora del remito; «Inicio» y «Fin», las de la carga (hora del puente); «Salió», la salida de la geocerca de la planta por GPS (viajes_gps). Las cargas «leídas» son del reporte de Indumix (etapa A), unidas por Observación o por camión y hora. Ejemplo, salvo los kilos del remito 885 (reporte real).</div></div>`;
}
function reiniciar() {
  const keep = S ? { rol: S.rol, disp: S.disp, vel: S.vel, pant: S.pant, hc: S.hc } : {};
  S = Object.assign(datosIniciales(), keep);
  armarRecetas(); armarAuditoria();
  S.alertas = [
    { key: "hist:7", tipo: "cambio", estado: "cerrada", at: T(8, 10), titulo: "La receta 7 cambió en Indumix entre 08:05 y 08:10", det: "Agua 160 → 165 L/m³: quedó igual a la fórmula H17-6/20 B.", res: "Se cerró sola (leída 08:10)" },
    { key: "rec:14:RDC-300 (CAN)", tipo: "receta", estado: "abierta", at: T(6, 59), code: "RDC-300 (CAN)", titulo: "La receta 14 no coincide con RDC-300 (CAN)", det: "El Espumígeno (600 g/m³) no está en ninguna salida de Indumix. ¿Se agrega a mano?" },
    { key: "hum", tipo: "humedad", estado: "info", at: T(7, 30), titulo: "Humedad de la Arena Fina distinta", det: "Indumix usa 3 % y el acopio medido a las 07:30 dio 6 %. No frena." },
    { key: "reloj", tipo: "reloj", estado: "info", at: PLANTA_PRENDIDA, titulo: "Indumix arrancó a las 06:58 con el reloj en 1/1/1970 0:00", det: "Pasa todos los días. Todas las cargas van con la hora del puente." },
  ];
  asegurarAlertas();
  ["rol", "disp"].forEach((id) => ($(id).value = S[id])); $("vel").value = String(S.vel);
  cerrarModal(); renderAll();
}

reiniciar();
requestAnimationFrame(tick);

</script>
